<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gemela">
  <title>Gemela</title>
  <!-- Gemela means identical twin. Two capsules, same geometry: one solid, one outline.
       The pair reads as a twin at 512px and still reads as a mark at 16px, which is the
       only test a favicon has to pass. -->
  <rect width="512" height="512" rx="112" fill="#0b0d0b"/>
  <g transform="rotate(-6 256 256)">
    <rect x="150" y="118" width="104" height="276" rx="52" fill="#39c9b4"/>
    <rect x="264" y="118" width="104" height="276" rx="52" fill="none" stroke="#39c9b4" stroke-width="17"/>
  </g>
</svg>
